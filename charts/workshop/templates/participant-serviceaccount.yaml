{{/*
Participant pods assume this account. When a dataset is configured it carries
the IRSA annotation that lets the sync init container read the bucket; with no
dataset it is a plain, permissionless identity.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "workshop.participantServiceAccount" . }}
  labels:
    {{- include "workshop.labels" . | nindent 4 }}
  {{- with .Values.dataset.awsRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
