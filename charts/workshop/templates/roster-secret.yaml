{{/*
Only scrypt verifiers reach the cluster. The plaintext passwords stay in the
maintainer's handout.csv and are never transmitted.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workshop.rosterSecret" . }}
  labels:
    {{- include "workshop.labels" . | nindent 4 }}
type: Opaque
stringData:
  roster.json: |
    {{- dict "participants" .Values.roster | toPrettyJson | nindent 4 }}
